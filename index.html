
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phone Number Checker</title>

<style>
body {
    background: #101522;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    padding: 60px 15px;
}

.container {
    background: #1c2638;
    padding: 25px;
    border-radius: 15px;
    width: 340px;
    text-align: center;
}

input {
    width: 90%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    margin: 15px 0;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #805ad5;
    color: white;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">

<h2>Phone Lookup</h2>
<p>Periksa format nomor telepon</p>

<input
id="phone"
type="tel"
placeholder="+6281234567890"
>

<br>

<button onclick="checkNumber()">
Check Number
</button>

<div id="result"></div>

</div>

<script>
function checkNumber() {

    let number = document
        .getElementById("phone")
        .value.trim();

    let result = document
        .getElementById("result");

    if (!/^\+?[0-9\s-]+$/.test(number)) {
        result.innerHTML = "Format nomor tidak valid.";
        return;
    }

    let clean = number.replace(/[\s-]/g, "");

    if (!clean.startsWith("+")) {
        result.innerHTML =
        "Gunakan kode negara, misalnya +62.";
        return;
    }

    let country = "Tidak diketahui";

    if (clean.startsWith("+62")) {
        country = "Indonesia";
    } else if (clean.startsWith("+44")) {
        country = "United Kingdom";
    } else if (clean.startsWith("+1")) {
        country = "United States / Canada";
    }

    result.innerHTML = `
        <h3>Hasil Pemeriksaan</h3>
        <p>Nomor: ${clean}</p>
        <p>Negara: ${country}</p>
        <p>Status: Format berhasil diperiksa</p>
        <small>Ini bukan pelacakan lokasi atau identifikasi pemilik.</small>
    `;
}
</script>

</body>
  </html>
